<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botnet Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: linear-gradient(130deg, #1e1e2f, #2a2a3b);
      overflow: hidden;
    }

    canvas#guiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .no-bots {
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      text-align: center;
      font-size: 1.2rem;
      opacity: 0.7;
    }

    .settings-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 50%;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .settings-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .settings-menu {
      display: none;
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      color: #fff;
    }

    .settings-menu input[type="color"],
    .settings-menu input[type="range"] {
      width: 100%;
      padding: 10px;
      background-color: #333;
      border: none;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .settings-menu .title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #matrixBackgroundBtn {
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 30px;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
      text-align: center;
    }

    #matrixBackgroundBtn:hover {
      background: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <canvas id="guiCanvas"></canvas>

  <main class="container">
    <section class="main">
      <h1>Connected Bots</h1>
      <div id="botList" class="no-bots">🚫 No bots connected</div>
    </section>
  </main>

  <button class="settings-btn" aria-label="Settings">⚙️</button>

  <aside class="settings-menu">
    <div class="title">Customize Background & Lines</div>
    <label>
      Background Color
      <input type="color" id="bgColor" value="#1e1e2f" />
    </label>
    <label>
      Line Color
      <input type="color" id="lineColor" value="#ffffff" />
    </label>
    <label>
      Line Fade Duration
      <input type="range" id="lineFadeDuration" min="1" max="10" value="3" />
    </label>
    <label>
      Line Speed
      <input type="range" id="lineSpeed" min="1" max="10" value="3" />
    </label>
    <label>
      Matrix Background
      <button id="matrixBackgroundBtn">Enable Matrix Background</button>
    </label>
    <label>
      Matrix Characters per Frame
      <input type="range" id="matrixCharsRange" min="1" max="100" value="50" />
    </label>
    <button id="undoBackgroundBtn">Undo Matrix Background</button>
  </aside>

  <script>
    const canvas = document.getElementById('guiCanvas');
    const ctx = canvas.getContext('2d');
    const settingsBtn = document.querySelector('.settings-btn');
    const settingsMenu = document.querySelector('.settings-menu');
    const bgColorInput = document.getElementById('bgColor');
    const lineColorInput = document.getElementById('lineColor');
    const lineFadeDurationInput = document.getElementById('lineFadeDuration');
    const lineSpeedInput = document.getElementById('lineSpeed');
    const matrixBackgroundBtn = document.getElementById('matrixBackgroundBtn');
    const undoBackgroundBtn = document.getElementById('undoBackgroundBtn');
    const matrixCharsRange = document.getElementById('matrixCharsRange');

    let originalBackground = 'linear-gradient(130deg, #1e1e2f, #2a2a3b)';
    let matrixBackgroundEnabled = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const points = Array.from({ length: 150 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: Math.random() * 2 - 1,
      vy: Math.random() * 2 - 1,
      alpha: 0
    }));

    let lineFadeDuration = 3;
    let lineColor = '#ffffff';
    let lineSpeed = 3;
    let matrixCharsPerFrame = 50;
    const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+=[]{}|:;<>,.?/~`";
    let matrixDrops = [];
    const matrixFontSize = 18;

    settingsBtn.onclick = () => {
      settingsMenu.style.display = settingsMenu.style.display === 'block' ? 'none' : 'block';
    };

    bgColorInput.oninput = e => {
      document.body.style.background = e.target.value;
      if (matrixBackgroundEnabled) disableMatrixBackground();
    };

    lineColorInput.oninput = e => lineColor = e.target.value;
    lineFadeDurationInput.oninput = e => lineFadeDuration = parseFloat(e.target.value);
    lineSpeedInput.oninput = e => lineSpeed = parseFloat(e.target.value);
    matrixCharsRange.oninput = e => matrixCharsPerFrame = parseInt(e.target.value);

    matrixBackgroundBtn.onclick = enableMatrixBackground;
    undoBackgroundBtn.onclick = disableMatrixBackground;

    function enableMatrixBackground() {
      matrixBackgroundEnabled = true;
      document.body.style.background = 'black';
      matrixDrops = Array.from({ length: canvas.width / matrixFontSize }, (_, i) => ({
        x: i * matrixFontSize,
        y: Math.random() * canvas.height,
        speed: Math.random() * 5 + 3
      }));
      matrixBackgroundLoop();
    }

    function disableMatrixBackground() {
      matrixBackgroundEnabled = false;
      document.body.style.background = originalBackground;
      matrixDrops = [];
    }

    function matrixBackgroundLoop() {
      if (!matrixBackgroundEnabled) return;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0F0';
      ctx.font = `${matrixFontSize}px monospace`;

      for (const drop of matrixDrops) {
        const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        ctx.fillText(char, drop.x, drop.y);
        drop.y += drop.speed;
        if (drop.y > canvas.height) drop.y = 0;
      }

      requestAnimationFrame(matrixBackgroundLoop);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of points) {
        p.x += p.vx * lineSpeed;
        p.y += p.vy * lineSpeed;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fill();
      }

      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 100) {
            const alpha = 1 - dist / 100;
            const r = parseInt(lineColor.slice(1, 3), 16);
            const g = parseInt(lineColor.slice(3, 5), 16);
            const b = parseInt(lineColor.slice(5, 7), 16);

            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[j].x, points[j].y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(draw);
    }

    async function fetchBots() {
      try {
        const res = await fetch("/bots");
        const bots = await res.json();
        const botList = document.getElementById("botList");

        if (!bots.length) {
          botList.className = "no-bots";
          botList.innerHTML = "🚫 No bots connected";
        } else {
          botList.className = "";
          botList.innerHTML = bots.map(bot =>
            `<div>🟢 <strong>${bot.hostname}</strong> - ${bot.ip}</div>`
          ).join('');
        }
      } catch (error) {
        console.error("Error fetching bots:", error);
      }
    }

    draw();
    fetchBots();
    setInterval(fetchBots, 2000);
  </script>
</body>
</html>
